<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 三栏对比工具</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#f1f5f9;color:#1e293b;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* 顶部工具栏 */
.toolbar{background:#fff;border-bottom:1px solid #e2e8f0;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-shrink:0;flex-wrap:wrap}
.toolbar h1{font-size:16px;font-weight:700;color:#0f172a}
.toolbar .subtitle{font-size:12px;color:#64748b}
.compare-selector{display:flex;align-items:center;gap:8px;margin-left:auto}
.compare-selector label{font-size:13px;color:#475569}
.compare-selector select{padding:6px 10px;border:1px solid #cbd5e1;border-radius:6px;font-size:13px;background:#fff;cursor:pointer}
.compare-selector select:focus{outline:none;border-color:#3b82f6}
.btn{padding:6px 14px;border:1px solid #cbd5e1;border-radius:6px;background:#fff;font-size:13px;cursor:pointer;transition:all .15s;color:#334155}
.btn:hover{background:#f8fafc;border-color:#94a3b8}
.btn-primary{background:#3b82f6;color:#fff;border-color:#3b82f6}
.btn-primary:hover{background:#2563eb;border-color:#2563eb}
.btn-danger{color:#dc2626}
.btn-danger:hover{background:#fef2f2;border-color:#fca5a5}

/* 三栏区域 */
.panels{display:flex;gap:1px;background:#e2e8f0;flex:1;min-height:0;overflow:hidden}
.panel{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff;min-width:280px}
.panel-header{padding:8px 12px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px;flex-shrink:0}
.panel-header .tag{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.tag-a{background:#dbeafe;color:#1d4ed8}
.tag-b{background:#dcfce7;color:#15803d}
.tag-c{background:#fef3c7;color:#b45309}
.panel-header .title{font-size:13px;font-weight:600;color:#334155;flex:1}
.panel-header .actions{display:flex;gap:4px}
.panel-header .icon-btn{width:28px;height:28px;border:1px solid #e2e8f0;border-radius:5px;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;color:#64748b;transition:all .15s}
.panel-header .icon-btn:hover{background:#f1f5f9;color:#334155}
.icon-btn svg{width:1em;height:1em;display:block}
.panel-body{flex:1;overflow:hidden;position:relative;display:flex}
.line-numbers{width:48px;flex-shrink:0;background:#f8fafc;border-right:1px solid #e2e8f0;overflow:hidden;padding:8px 0;text-align:right;user-select:none}
.line-numbers .ln{display:block;padding:0 8px;font-family:'Consolas','Monaco',monospace;font-size:12px;line-height:1.6;color:#94a3b8}
.line-numbers .ln.active{background:#e0e7ff;color:#4f46e5;font-weight:600}
.code-area{flex:1;overflow:auto;padding:8px 0;font-family:'Consolas','Monaco',monospace;font-size:12px;line-height:1.6}
.code-line{padding:0 12px;white-space:pre;min-height:1.6em}
.code-line.added{background:#dcfce7}
.code-line.removed{background:#fee2e2}
.code-line.modified{background:#fef9c3}
.code-line.renamed{background:#ede9fe}
.code-line.type-change{background:#ffedd5}
.code-line.highlight{outline:2px solid #3b82f6;outline-offset:-2px}

/* 编辑模式 */
.edit-area{flex:1;display:flex;flex-direction:column;padding:8px}
.edit-area textarea{flex:1;width:100%;border:1px solid #e2e8f0;border-radius:6px;padding:10px;font-family:'Consolas','Monaco',monospace;font-size:12px;line-height:1.6;resize:none;outline:none;color:#1e293b}
.edit-area textarea:focus{border-color:#3b82f6}
.edit-area .edit-hint{font-size:11px;color:#94a3b8;margin-top:6px;text-align:center}
.edit-area .edit-actions{display:flex;gap:8px;margin-top:8px;justify-content:center}

/* 空状态 */
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#94a3b8;gap:12px;padding:20px;text-align:center}
.empty-state .big-icon{font-size:38px;opacity:.4;color:#94a3b8;line-height:1}
.empty-state p{font-size:13px}
.empty-state .empty-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* 错误提示 */
.error-banner{padding:8px 12px;background:#fef2f2;border-bottom:1px solid #fecaca;color:#dc2626;font-size:12px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.error-banner .err-msg{flex:1}

/* 结果面板 */
.result-panel{background:#fff;border-top:2px solid #e2e8f0;display:flex;flex-direction:column;flex-shrink:0;height:300px;transition:height .2s}
.result-panel.collapsed{height:36px}
.result-header{padding:8px 16px;background:#f8fafc;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.result-header .rh-title{font-size:13px;font-weight:600;color:#334155}
.result-header .stats{display:flex;gap:10px;font-size:12px}
.stat-badge{padding:2px 8px;border-radius:10px;font-weight:600}
.stat-added{background:#dcfce7;color:#15803d}
.stat-removed{background:#fee2e2;color:#dc2626}
.stat-modified{background:#fef9c3;color:#a16207}
.stat-renamed{background:#ede9fe;color:#6d28d9}
.stat-type{background:#ffedd5;color:#c2410c}
.result-header .filters{display:flex;gap:4px;margin-left:auto;align-items:center}
.filter-btn{padding:3px 10px;border:1px solid #e2e8f0;border-radius:12px;background:#fff;font-size:11px;cursor:pointer;color:#64748b;transition:all .15s}
.filter-btn:hover{background:#f1f5f9}
.filter-btn.active{background:#3b82f6;color:#fff;border-color:#3b82f6}
.result-header .toggle{display:inline-flex;align-items:center;font-size:12px;color:#94a3b8;margin-left:8px;transition:transform .2s}
.result-panel.collapsed #toggleIcon{transform:rotate(180deg)}
.err-icon{display:inline-flex;font-size:16px;color:#dc2626;flex-shrink:0}
.stat-ok{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#15803d;font-weight:600}
.result-body{flex:1;overflow:auto;padding:8px 16px}
.result-item{padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px;cursor:pointer;transition:all .15s;background:#fff}
.result-item:hover{border-color:#93c5fd;background:#f8fafc}
.result-item .ri-header{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ri-type{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;flex-shrink:0}
.ri-path{font-family:'Consolas','Monaco',monospace;font-size:12px;color:#1e293b;font-weight:600;word-break:break-all}
.ri-lines{font-size:11px;color:#94a3b8;margin-left:auto;flex-shrink:0}
.ri-detail{font-size:12px;color:#475569;display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.ri-detail .side{flex:1;min-width:120px}
.ri-detail .side-label{font-size:10px;color:#94a3b8;margin-bottom:2px;font-weight:600}
.ri-detail .side-value{font-family:'Consolas','Monaco',monospace;font-size:11px;background:#f8fafc;padding:4px 8px;border-radius:4px;word-break:break-all;max-height:60px;overflow:auto}
.ri-detail .arrow{color:#94a3b8;align-self:center;font-size:14px}
.no-result{text-align:center;padding:40px;color:#94a3b8;font-size:13px}
.no-result .big-icon{font-size:40px;margin-bottom:8px;opacity:.4}

/* 隐藏文件input */
.file-input{display:none}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:#f1f5f9}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}

/* 响应式 */
@media(max-width:900px){
  .panels{flex-direction:column}
  .panel{min-width:0;min-height:200px}
}
</style>
</head>
<body>

<div class="toolbar">
  <h1>JSON 三栏对比工具</h1>
  <span class="subtitle">单文件 · 零依赖 · 纯本地运行</span>
  <div class="compare-selector">
    <label>对比对：</label>
    <select id="comparePair">
      <option value="ab">官方老 ↔ 官方新</option>
      <option value="ac">官方老 ↔ 翻译稿</option>
      <option value="bc">官方新 ↔ 翻译稿</option>
    </select>
    <button class="btn btn-primary" id="runDiff">开始对比</button>
  </div>
</div>

<div class="panels">
  <!-- 区域A：官方老文件 -->
  <div class="panel" id="panelA">
    <div class="panel-header">
      <span class="tag tag-a">A</span>
      <span class="title">官方老文件</span>
      <div class="actions">
        <button class="icon-btn" data-icon="folder" title="导入文件" onclick="triggerFile('A')"></button>
        <button class="icon-btn" data-icon="pencil" title="编辑" onclick="toggleEdit('A')"></button>
        <button class="icon-btn" data-icon="trash" title="清空" onclick="clearPanel('A')"></button>
      </div>
    </div>
    <div class="panel-body" id="bodyA">
      <div class="empty-state">
        <div class="big-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></div>
        <p>导入 .json 文件，或点击"编辑"粘贴 JSON 文本</p>
      </div>
    </div>
    <input type="file" class="file-input" id="fileA" accept=".json,application/json" onchange="handleFile('A',this)">
  </div>

  <!-- 区域B：官方新文件 -->
  <div class="panel" id="panelB">
    <div class="panel-header">
      <span class="tag tag-b">B</span>
      <span class="title">官方新文件</span>
      <div class="actions">
        <button class="icon-btn" data-icon="folder" title="导入文件" onclick="triggerFile('B')"></button>
        <button class="icon-btn" data-icon="pencil" title="编辑" onclick="toggleEdit('B')"></button>
        <button class="icon-btn" data-icon="trash" title="清空" onclick="clearPanel('B')"></button>
      </div>
    </div>
    <div class="panel-body" id="bodyB">
      <div class="empty-state">
        <div class="big-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></div>
        <p>导入 .json 文件，或点击"编辑"粘贴 JSON 文本</p>
      </div>
    </div>
    <input type="file" class="file-input" id="fileB" accept=".json,application/json" onchange="handleFile('B',this)">
  </div>

  <!-- 区域C：翻译稿 -->
  <div class="panel" id="panelC">
    <div class="panel-header">
      <span class="tag tag-c">C</span>
      <span class="title">翻译好后文件</span>
      <div class="actions">
        <button class="icon-btn" data-icon="folder" title="导入文件" onclick="triggerFile('C')"></button>
        <button class="icon-btn" data-icon="pencil" title="编辑" onclick="toggleEdit('C')"></button>
        <button class="icon-btn" data-icon="trash" title="清空" onclick="clearPanel('C')"></button>
      </div>
    </div>
    <div class="panel-body" id="bodyC">
      <div class="empty-state">
        <div class="big-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg></div>
        <p>导入 .json 文件，或点击"编辑"粘贴 JSON 文本</p>
      </div>
    </div>
    <input type="file" class="file-input" id="fileC" accept=".json,application/json" onchange="handleFile('C',this)">
  </div>
</div>

<!-- 结果面板 -->
<div class="result-panel" id="resultPanel">
  <div class="result-header" onclick="toggleResult()">
    <span class="rh-title">对比结果</span>
    <div class="stats" id="statsBar"></div>
    <div class="filters" id="filterBar">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',event)">全部</button>
      <button class="filter-btn" data-filter="added" onclick="setFilter('added',event)">新增</button>
      <button class="filter-btn" data-filter="removed" onclick="setFilter('removed',event)">删除</button>
      <button class="filter-btn" data-filter="modified" onclick="setFilter('modified',event)">修改</button>
      <button class="filter-btn" data-filter="renamed" onclick="setFilter('renamed',event)">改名</button>
      <button class="filter-btn" data-filter="type-change" onclick="setFilter('type-change',event)">类型</button>
    </div>
    <span class="toggle" id="toggleIcon"></span>
  </div>
  <div class="result-body" id="resultBody">
    <div class="no-result">
      <div class="big-icon"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      请在至少两个区域中填入 JSON 内容，然后点击"开始对比"
    </div>
  </div>
</div>

<script>
// ============================================================
// 全局状态
// ============================================================
const state = {
  A: { raw: '', parsed: null, formatted: '', pathRanges: {}, totalLines: 0, error: null, mode: 'view' },
  B: { raw: '', parsed: null, formatted: '', pathRanges: {}, totalLines: 0, error: null, mode: 'view' },
  C: { raw: '', parsed: null, formatted: '', pathRanges: {}, totalLines: 0, error: null, mode: 'view' },
  diffResults: [],
  currentFilter: 'all',
  resultCollapsed: false
};

const PANEL_NAMES = { A: '官方老文件', B: '官方新文件', C: '翻译稿' };

// 手绘 SVG 线框图标（不使用 emoji，减少"AI 感"）
const ICONS = {
  folder: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  pencil: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/></svg>',
  trash: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>',
  doc: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>',
  warn: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
  search: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>',
  check: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m22 4-10 10.01-3-3"/></svg>',
  chevron: '<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
};

// ============================================================
// 工具函数
// ============================================================
function getType(v) {
  if (v === null) return 'null';
  if (Array.isArray(v)) return 'array';
  return typeof v;
}

function primitiveToStr(v) {
  if (v === null) return 'null';
  if (typeof v === 'string') return JSON.stringify(v);
  if (typeof v === 'number' || typeof v === 'boolean') return String(v);
  return JSON.stringify(v);
}

function valueToShortStr(v, maxLen = 80) {
  let s;
  if (v === null) s = 'null';
  else if (typeof v === 'string') s = JSON.stringify(v);
  else if (typeof v === 'object') s = JSON.stringify(v);
  else s = String(v);
  if (s.length > maxLen) s = s.substring(0, maxLen) + '...';
  return s;
}

// ============================================================
// JSON 格式化 + 行号映射
// ============================================================
function formatWithPaths(obj, indent = 2) {
  const lines = [];
  const pathRanges = {};

  function writeKeyValue(key, value, path, depth) {
    const pad = ' '.repeat(depth * indent);
    const start = lines.length;
    if (value !== null && typeof value === 'object') {
      const open = Array.isArray(value) ? '[' : '{';
      lines.push(pad + JSON.stringify(key) + ': ' + open);
      if (Array.isArray(value)) {
        if (value.length > 0) {
          for (let i = 0; i < value.length; i++) {
            process(value[i], path + '[' + i + ']', depth + 1);
            if (i < value.length - 1) lines[lines.length - 1] += ',';
          }
        }
      } else {
        const subKeys = Object.keys(value);
        if (subKeys.length > 0) {
          for (let i = 0; i < subKeys.length; i++) {
            writeKeyValue(subKeys[i], value[subKeys[i]], path + '.' + subKeys[i], depth + 1);
            if (i < subKeys.length - 1) lines[lines.length - 1] += ',';
          }
        }
      }
      const close = Array.isArray(value) ? ']' : '}';
      lines.push(pad + close);
    } else {
      lines.push(pad + JSON.stringify(key) + ': ' + primitiveToStr(value));
    }
    pathRanges[path] = { start: start + 1, end: lines.length };
  }

  function process(value, path, depth) {
    const pad = ' '.repeat(depth * indent);
    const start = lines.length;
    if (value === null || typeof value !== 'object') {
      lines.push(pad + primitiveToStr(value));
    } else if (Array.isArray(value)) {
      if (value.length === 0) {
        lines.push(pad + '[]');
      } else {
        lines.push(pad + '[');
        for (let i = 0; i < value.length; i++) {
          process(value[i], path + '[' + i + ']', depth + 1);
          if (i < value.length - 1) lines[lines.length - 1] += ',';
        }
        lines.push(pad + ']');
      }
    } else {
      const keys = Object.keys(value);
      if (keys.length === 0) {
        lines.push(pad + '{}');
      } else {
        lines.push(pad + '{');
        for (let i = 0; i < keys.length; i++) {
          writeKeyValue(keys[i], value[keys[i]], path ? path + '.' + keys[i] : keys[i], depth + 1);
          if (i < keys.length - 1) lines[lines.length - 1] += ',';
        }
        lines.push(pad + '}');
      }
    }
    if (path) pathRanges[path] = { start: start + 1, end: lines.length };
  }

  process(obj, '', 0);
  return { text: lines.join('\n'), pathRanges, totalLines: lines.length };
}

// ============================================================
// 预处理：去BOM、统一换行
// ============================================================
function preprocess(text) {
  if (text.charCodeAt(0) === 0xFEFF) text = text.substring(1);
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  return text;
}

// ============================================================
// 解析并格式化
// ============================================================
function parseAndFormat(panel) {
  const s = state[panel];
  s.error = null;
  if (!s.raw.trim()) {
    s.parsed = null;
    s.formatted = '';
    s.pathRanges = {};
    s.totalLines = 0;
    return;
  }
  try {
    const processed = preprocess(s.raw);
    const obj = JSON.parse(processed);
    const result = formatWithPaths(obj);
    s.parsed = obj;
    s.formatted = result.text;
    s.pathRanges = result.pathRanges;
    s.totalLines = result.totalLines;
  } catch (e) {
    s.parsed = null;
    s.formatted = '';
    s.pathRanges = {};
    s.totalLines = 0;
    s.error = e.message;
  }
}

// ============================================================
// 核心对比引擎
// ============================================================
function joinPath(path, key) {
  return path ? path + '.' + key : key;
}

function joinArrayPath(path, idx) {
  return path + '[' + idx + ']';
}

// 稳定序列化（键排序），用于数组元素按内容匹配（与位置无关）
function stableSerialize(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v);
  if (Array.isArray(v)) return '[' + v.map(stableSerialize).join(',') + ']';
  const keys = Object.keys(v).sort();
  return '{' + keys.map(k => JSON.stringify(k) + ':' + stableSerialize(v[k])).join(',') + '}';
}

// 对象内常见的"标识字段"，用于数组元素改名检测
const IDENTIFIER_KEYS = ['key', 'id', '_id'];

function diffValues(a, b, leftPath, rightPath) {
  const results = [];
  const typeA = getType(a);
  const typeB = getType(b);
  const lp = leftPath || '';
  const rp = rightPath || '';
  if (typeA !== typeB) {
    results.push({ type: 'type-change', path: rp, leftPath: lp, rightPath: rp, oldValue: a, newValue: b, oldType: typeA, newType: typeB });
    return results;
  }
  if (typeA === 'object') return diffObjects(a, b, lp, rp);
  if (typeA === 'array') return diffArrays(a, b, lp, rp);
  if (a !== b) {
    results.push({ type: 'modified', path: rp, leftPath: lp, rightPath: rp, oldValue: a, newValue: b });
  }
  return results;
}

function diffObjects(a, b, leftPath, rightPath) {
  const results = [];
  const keysA = Object.keys(a);
  const keysB = Object.keys(b);
  const common = keysA.filter(k => k in b);
  for (const key of common) {
    results.push(...diffValues(a[key], b[key], joinPath(leftPath, key), joinPath(rightPath, key)));
  }
  const removed = keysA.filter(k => !(k in b)).map(k => ({ key: k, value: a[k] }));
  const added = keysB.filter(k => !(k in a)).map(k => ({ key: k, value: b[k] }));
  const { renamed, remainingRemoved, remainingAdded } = matchRenames(removed, added, leftPath, rightPath);
  results.push(...renamed);
  for (const k of remainingRemoved) {
    results.push({ type: 'removed', path: joinPath(leftPath, k), leftPath: joinPath(leftPath, k), rightPath: '', oldValue: a[k] });
  }
  for (const k of remainingAdded) {
    results.push({ type: 'added', path: joinPath(rightPath, k), leftPath: '', rightPath: joinPath(rightPath, k), newValue: b[k] });
  }
  return results;
}

// 数组对比：按元素内容匹配，不依赖位置顺序。
// 元素在中间插入 / 删除时，不会再把后续元素连锁误报为"修改"。
function diffArrays(a, b, leftPath, rightPath) {
  const results = [];
  const n = a.length, m = b.length;
  const matchedA = new Array(n).fill(false);
  const matchedB = new Array(m).fill(false);

  // 第一轮：内容完全相同的元素直接配对（位置无关）
  const byHash = new Map();
  for (let j = 0; j < m; j++) {
    const h = stableSerialize(b[j]);
    if (!byHash.has(h)) byHash.set(h, []);
    byHash.get(h).push(j);
  }
  for (let i = 0; i < n; i++) {
    const h = stableSerialize(a[i]);
    const list = byHash.get(h);
    if (list && list.length) {
      matchedA[i] = true;
      matchedB[list.pop()] = true;
    }
  }

  // 第二轮：未匹配元素按相似度配对（覆盖内容修改、键名变更、顺序调整）
  const uA = [], uB = [];
  for (let i = 0; i < n; i++) if (!matchedA[i]) uA.push(i);
  for (let j = 0; j < m; j++) if (!matchedB[j]) uB.push(j);

  const pairs = [];
  for (const i of uA) {
    for (const j of uB) {
      if (!plausiblePair(a[i], b[j])) continue;
      const sim = valueSimilarity(a[i], b[j]);
      if (sim >= 0.5) pairs.push({ i, j, sim });
    }
  }
  pairs.sort((x, y) => y.sim - x.sim);
  const usedA = new Set(), usedB = new Set();
  for (const p of pairs) {
    if (usedA.has(p.i) || usedB.has(p.j)) continue;
    usedA.add(p.i); usedB.add(p.j);
    results.push(...diffArrayElementPair(a[p.i], b[p.j], joinArrayPath(leftPath, p.i), joinArrayPath(rightPath, p.j)));
  }

  // 剩余：真实的新增 / 删除
  for (let i = 0; i < n; i++) {
    if (matchedA[i] || usedA.has(i)) continue;
    results.push({ type: 'removed', path: joinArrayPath(leftPath, i), leftPath: joinArrayPath(leftPath, i), rightPath: '', oldValue: a[i] });
  }
  for (let j = 0; j < m; j++) {
    if (matchedB[j] || usedB.has(j)) continue;
    results.push({ type: 'added', path: joinArrayPath(rightPath, j), leftPath: '', rightPath: joinArrayPath(rightPath, j), newValue: b[j] });
  }
  return results;
}

// 粗糙预筛：两个元素类型不同、或无任何公共键时，不可能是"同一个元素"
function plausiblePair(x, y) {
  if (x === null || y === null) return x === y;
  if (typeof x !== typeof y) return false;
  if (Array.isArray(x) !== Array.isArray(y)) return false;
  if (typeof x === 'object') {
    const kx = Object.keys(x);
    if (!kx.some(k => k in y)) return false;
  }
  return true;
}

// 数组元素配对后的差异化：若元素是对象且仅标识字段（key/id/_id）改名，
// 则报告为"改名"，否则走常规递归对比。
function diffArrayElementPair(a, b, lp, rp) {
  const isPlainObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);
  if (isPlainObj(a) && isPlainObj(b)) {
    const idK = IDENTIFIER_KEYS.find(k => k in a && k in b);
    if (idK && a[idK] !== b[idK]) {
      const restA = Object.assign({}, a); delete restA[idK];
      const restB = Object.assign({}, b); delete restB[idK];
      const inner = stableSerialize(restA) === stableSerialize(restB)
        ? []
        : diffValues(restA, restB, lp, rp).filter(d => d.type === 'modified' || d.type === 'type-change');
      return [{
        type: 'renamed',
        path: rp,
        leftPath: lp,
        rightPath: rp,
        oldKey: String(a[idK]),
        newKey: String(b[idK]),
        oldPath: lp,
        oldValue: a,
        newValue: b,
        similarity: valueSimilarity(a, b),
        innerDiffs: inner
      }];
    }
  }
  return diffValues(a, b, lp, rp);
}

// ============================================================
// 键名变更匹配
// ============================================================
function matchRenames(removed, added, leftParent, rightParent) {
  const renamed = [];
  const usedR = new Set();
  const usedA = new Set();
  const pairs = [];
  for (let i = 0; i < removed.length; i++) {
    for (let j = 0; j < added.length; j++) {
      const sim = valueSimilarity(removed[i].value, added[j].value);
      if (sim >= 0.7) pairs.push({ i, j, sim });
    }
  }
  pairs.sort((x, y) => y.sim - x.sim);
  for (const p of pairs) {
    if (usedR.has(p.i) || usedA.has(p.j)) continue;
    usedR.add(p.i);
    usedA.add(p.j);
    const r = removed[p.i];
    const a = added[p.j];
    const oldPath = leftParent ? leftParent + '.' + r.key : r.key;
    const newPath = rightParent ? rightParent + '.' + a.key : a.key;
    const innerDiffs = diffValues(r.value, a.value, oldPath, newPath).filter(d => d.type === 'modified' || d.type === 'type-change');
    renamed.push({
      type: 'renamed',
      path: newPath,
      leftPath: oldPath,
      rightPath: newPath,
      oldKey: r.key,
      newKey: a.key,
      oldPath,
      oldValue: r.value,
      newValue: a.value,
      similarity: p.sim,
      innerDiffs
    });
  }
  return {
    renamed,
    remainingRemoved: removed.filter((_, i) => !usedR.has(i)).map(x => x.key),
    remainingAdded: added.filter((_, j) => !usedA.has(j)).map(x => x.key)
  };
}

function valueSimilarity(a, b) {
  if (a === b) return 1.0;
  if (a === null || b === null) return 0;
  if (typeof a !== typeof b) return 0;
  if (typeof a === 'string') return stringSimilarity(a, b);
  if (typeof a === 'number' || typeof a === 'boolean') return a === b ? 1.0 : 0;
  if (Array.isArray(a) && Array.isArray(b)) {
    const len = Math.min(a.length, b.length);
    let same = 0;
    for (let i = 0; i < len; i++) {
      if (JSON.stringify(a[i]) === JSON.stringify(b[i])) same++;
    }
    return Math.max(a.length, b.length) === 0 ? 1 : same / Math.max(a.length, b.length);
  }
  if (typeof a === 'object' && typeof b === 'object') {
    const keysA = Object.keys(a);
    const keysB = Object.keys(b);
    const common = keysA.filter(k => k in b);
    let same = 0;
    for (const k of common) {
      if (JSON.stringify(a[k]) === JSON.stringify(b[k])) same++;
    }
    return Math.max(keysA.length, keysB.length) === 0 ? 1 : same / Math.max(keysA.length, keysB.length);
  }
  return 0;
}

function stringSimilarity(a, b) {
  if (a === b) return 1.0;
  if (!a || !b) return 0;
  const maxLen = Math.max(a.length, b.length);
  return 1 - levenshtein(a, b) / maxLen;
}

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 0; i <= m; i++) dp[i][0] = i;
  for (let j = 0; j <= n; j++) dp[0][j] = j;
  for (let i = 1; i <= m; i++) {
    for (let j = 1; j <= n; j++) {
      dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
    }
  }
  return dp[m][n];
}

// ============================================================
// 渲染：面板内容
// ============================================================
function renderPanel(panel) {
  const s = state[panel];
  const body = document.getElementById('body' + panel);
  if (s.mode === 'edit') {
    body.innerHTML = `
      <div class="edit-area">
        <textarea id="textarea${panel}" placeholder="在此粘贴 JSON 文本...">${escapeHtml(s.raw)}</textarea>
        <div class="edit-hint">粘贴或编辑 JSON 文本后点击"应用"进行解析格式化</div>
        <div class="edit-actions">
          <button class="btn btn-primary" onclick="applyEdit('${panel}')">应用</button>
          <button class="btn" onclick="cancelEdit('${panel}')">取消</button>
        </div>
      </div>`;
    return;
  }
  if (s.error) {
    body.innerHTML = `
      <div class="error-banner" style="border-bottom:none;">
        <span class="err-icon">${ICONS.warn}</span>
        <span class="err-msg">JSON 解析错误：${escapeHtml(s.error)}</span>
        <button class="btn" style="padding:3px 10px;font-size:11px;" onclick="toggleEdit('${panel}')">去编辑</button>
      </div>
      <div class="edit-area" style="flex:1;">
        <textarea readonly style="background:#fef2f2;">${escapeHtml(s.raw)}</textarea>
      </div>`;
    return;
  }
  if (!s.formatted) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="big-icon">${ICONS.doc}</div>
        <p>导入 .json 文件，或点击"编辑"粘贴 JSON 文本</p>
      </div>`;
    return;
  }
  const codeLines = s.formatted.split('\n');
  let lineNumbersHtml = '';
  let codeHtml = '';
  for (let i = 0; i < codeLines.length; i++) {
    lineNumbersHtml += `<span class="ln" data-ln="${i + 1}">${i + 1}</span>`;
    codeHtml += `<div class="code-line" data-line="${i + 1}">${escapeHtml(codeLines[i]) || ' '}</div>`;
  }
  body.innerHTML = `
    <div class="line-numbers" id="ln${panel}">${lineNumbersHtml}</div>
    <div class="code-area" id="code${panel}">${codeHtml}</div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ============================================================
// 渲染：差异高亮
// ============================================================
function highlightDiffs(leftPanel, rightPanel) {
  // 清除之前的高亮
  document.querySelectorAll('.code-line.added,.code-line.removed,.code-line.modified,.code-line.renamed,.code-line.type-change').forEach(el => {
    el.classList.remove('added', 'removed', 'modified', 'renamed', 'type-change');
  });
  if (!state.diffResults.length) return;
  for (const diff of state.diffResults) {
    const lp = diff.leftPath || diff.oldPath || diff.path;
    const rp = diff.rightPath || diff.path;
    if (diff.type === 'added') {
      highlightPath(rightPanel, rp, 'added');
    } else if (diff.type === 'removed') {
      highlightPath(leftPanel, lp, 'removed');
    } else {
      if (lp) highlightPath(leftPanel, lp, diff.type);
      if (rp) highlightPath(rightPanel, rp, diff.type);
    }
  }
}

function highlightPath(panel, path, cls) {
  const range = state[panel].pathRanges[path];
  if (!range) return;
  const codeArea = document.getElementById('code' + panel);
  if (!codeArea) return;
  for (let l = range.start; l <= range.end; l++) {
    const line = codeArea.querySelector('.code-line[data-line="' + l + '"]');
    if (line) line.classList.add(cls);
  }
}

// ============================================================
// 渲染：结果面板
// ============================================================
function renderResults(leftPanel, rightPanel) {
  const body = document.getElementById('resultBody');
  const filtered = state.currentFilter === 'all'
    ? state.diffResults
    : state.diffResults.filter(d => d.type === state.currentFilter);
  if (!filtered.length) {
    if (state.diffResults.length === 0) {
      body.innerHTML = `<div class="no-result"><div class="big-icon">${ICONS.check}</div>两份文件完全一致，没有发现差异</div>`;
    } else {
      body.innerHTML = `<div class="no-result"><div class="big-icon">${ICONS.search}</div>当前筛选条件下没有结果</div>`;
    }
    return;
  }
  let html = '';
  for (let i = 0; i < filtered.length; i++) {
    const d = filtered[i];
    const typeLabel = {
      'added': ['新增', 'stat-added'],
      'removed': ['删除', 'stat-removed'],
      'modified': ['修改', 'stat-modified'],
      'renamed': ['改名', 'stat-renamed'],
      'type-change': ['类型变化', 'stat-type']
    }[d.type] || [d.type, ''];
    let linesInfo = '';
    if (d.type === 'added') {
      const r = state[rightPanel].pathRanges[d.rightPath || d.path];
      if (r) linesInfo = `行 ${r.start}`;
    } else if (d.type === 'removed') {
      const r = state[leftPanel].pathRanges[d.leftPath || d.path];
      if (r) linesInfo = `行 ${r.start}`;
    } else if (d.type === 'renamed') {
      const r1 = state[leftPanel].pathRanges[d.leftPath || d.oldPath];
      const r2 = state[rightPanel].pathRanges[d.rightPath || d.path];
      linesInfo = `${r1 ? '行' + r1.start : '-'} ↔ ${r2 ? '行' + r2.start : '-'}`;
    } else {
      const r1 = state[leftPanel].pathRanges[d.leftPath];
      const r2 = state[rightPanel].pathRanges[d.rightPath];
      linesInfo = `${r1 ? '行' + r1.start : '-'} ↔ ${r2 ? '行' + r2.start : '-'}`;
    }
    let detailHtml = '';
    if (d.type === 'added') {
      detailHtml = `<div class="side"><div class="side-label">${PANEL_NAMES[rightPanel]}</div><div class="side-value">${escapeHtml(valueToShortStr(d.newValue))}</div></div>`;
    } else if (d.type === 'removed') {
      detailHtml = `<div class="side"><div class="side-label">${PANEL_NAMES[leftPanel]}</div><div class="side-value">${escapeHtml(valueToShortStr(d.oldValue))}</div></div>`;
    } else if (d.type === 'renamed') {
      detailHtml = `
        <div class="side"><div class="side-label">老键名</div><div class="side-value">${escapeHtml(d.oldKey)}</div></div>
        <span class="arrow">→</span>
        <div class="side"><div class="side-label">新键名</div><div class="side-value">${escapeHtml(d.newKey)}</div></div>`;
      if (d.innerDiffs && d.innerDiffs.length) {
        detailHtml += `<div class="side" style="flex-basis:100%;"><div class="side-label">值内部变化（${d.innerDiffs.length}处）</div><div class="side-value">${d.innerDiffs.map(x => escapeHtml(x.path) + ': ' + escapeHtml(valueToShortStr(x.oldValue)) + ' → ' + escapeHtml(valueToShortStr(x.newValue))).join('<br>')}</div></div>`;
      }
    } else if (d.type === 'type-change') {
      detailHtml = `
        <div class="side"><div class="side-label">${PANEL_NAMES[leftPanel]} (${d.oldType})</div><div class="side-value">${escapeHtml(valueToShortStr(d.oldValue))}</div></div>
        <span class="arrow">→</span>
        <div class="side"><div class="side-label">${PANEL_NAMES[rightPanel]} (${d.newType})</div><div class="side-value">${escapeHtml(valueToShortStr(d.newValue))}</div></div>`;
    } else {
      detailHtml = `
        <div class="side"><div class="side-label">${PANEL_NAMES[leftPanel]}</div><div class="side-value">${escapeHtml(valueToShortStr(d.oldValue))}</div></div>
        <span class="arrow">→</span>
        <div class="side"><div class="side-label">${PANEL_NAMES[rightPanel]}</div><div class="side-value">${escapeHtml(valueToShortStr(d.newValue))}</div></div>`;
    }
    const pathDisplay = d.type === 'renamed'
      ? (d.oldPath === d.path ? d.path : d.oldPath + ' → ' + d.path)
      : d.path;
    html += `
      <div class="result-item" onclick="jumpToDiff(${i},'${leftPanel}','${rightPanel}')">
        <div class="ri-header">
          <span class="ri-type ${typeLabel[1]}">${typeLabel[0]}</span>
          <span class="ri-path">${escapeHtml(pathDisplay)}</span>
          <span class="ri-lines">${linesInfo}</span>
        </div>
        <div class="ri-detail">${detailHtml}</div>
      </div>`;
  }
  body.innerHTML = html;
}

function renderStats() {
  const counts = { added: 0, removed: 0, modified: 0, renamed: 0, 'type-change': 0 };
  for (const d of state.diffResults) counts[d.type] = (counts[d.type] || 0) + 1;
  const bar = document.getElementById('statsBar');
  let html = '';
  if (counts.added) html += `<span class="stat-badge stat-added">新增 ${counts.added}</span>`;
  if (counts.removed) html += `<span class="stat-badge stat-removed">删除 ${counts.removed}</span>`;
  if (counts.modified) html += `<span class="stat-badge stat-modified">修改 ${counts.modified}</span>`;
  if (counts.renamed) html += `<span class="stat-badge stat-renamed">改名 ${counts.renamed}</span>`;
  if (counts['type-change']) html += `<span class="stat-badge stat-type">类型 ${counts['type-change']}</span>`;
  if (!html) html = `<span class="stat-ok">${ICONS.check} 完全一致</span>`;
  bar.innerHTML = html;
}

// ============================================================
// 跳转定位
// ============================================================
function jumpToDiff(index, leftPanel, rightPanel) {
  const filtered = state.currentFilter === 'all'
    ? state.diffResults
    : state.diffResults.filter(d => d.type === state.currentFilter);
  const d = filtered[index];
  if (!d) return;
  document.querySelectorAll('.code-line.highlight').forEach(el => el.classList.remove('highlight'));
  document.querySelectorAll('.line-numbers .ln.active').forEach(el => el.classList.remove('active'));
  const lp = d.leftPath || d.oldPath || d.path;
  const rp = d.rightPath || d.path;
  if (d.type === 'added') {
    scrollToLine(rightPanel, rp);
  } else if (d.type === 'removed') {
    scrollToLine(leftPanel, lp);
  } else if (d.type === 'renamed') {
    scrollToLine(leftPanel, lp);
    scrollToLine(rightPanel, rp);
  } else {
    if (lp) scrollToLine(leftPanel, lp);
    if (rp) scrollToLine(rightPanel, rp);
  }
}

function scrollToLine(panel, path) {
  const range = state[panel].pathRanges[path];
  if (!range) return;
  const codeArea = document.getElementById('code' + panel);
  const lnArea = document.getElementById('ln' + panel);
  if (!codeArea) return;
  const line = codeArea.querySelector('.code-line[data-line="' + range.start + '"]');
  const ln = lnArea ? lnArea.querySelector('.ln[data-ln="' + range.start + '"]') : null;
  if (line) {
    line.classList.add('highlight');
    codeArea.scrollTop = line.offsetTop - codeArea.clientHeight / 2;
  }
  if (ln) {
    ln.classList.add('active');
    lnArea.scrollTop = ln.offsetTop - lnArea.clientHeight / 2;
  }
}

// ============================================================
// 主对比流程
// ============================================================
function runDiff() {
  const pair = document.getElementById('comparePair').value;
  const leftPanel = pair[0].toUpperCase();
  const rightPanel = pair[1].toUpperCase();
  const left = state[leftPanel];
  const right = state[rightPanel];
  if (!left.parsed) {
    alert('请先在【' + PANEL_NAMES[leftPanel] + '】中填入有效的 JSON');
    return;
  }
  if (!right.parsed) {
    alert('请先在【' + PANEL_NAMES[rightPanel] + '】中填入有效的 JSON');
    return;
  }
  state.diffResults = diffValues(left.parsed, right.parsed, '', '');
  // 按路径排序
  state.diffResults.sort((a, b) => a.path.localeCompare(b.path));
  renderStats();
  renderResults(leftPanel, rightPanel);
  highlightDiffs(leftPanel, rightPanel);
  // 展开结果面板
  if (state.resultCollapsed) toggleResult();
}

// ============================================================
// 交互函数
// ============================================================
function triggerFile(panel) {
  document.getElementById('file' + panel).click();
}

function handleFile(panel, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (e) {
    state[panel].raw = e.target.result;
    state[panel].mode = 'view';
    parseAndFormat(panel);
    renderPanel(panel);
  };
  reader.readAsText(file);
  input.value = '';
}

function toggleEdit(panel) {
  const s = state[panel];
  if (s.mode === 'view') {
    s.mode = 'edit';
    renderPanel(panel);
    const ta = document.getElementById('textarea' + panel);
    if (ta) ta.focus();
  } else {
    s.mode = 'view';
    renderPanel(panel);
  }
}

function applyEdit(panel) {
  const ta = document.getElementById('textarea' + panel);
  if (ta) state[panel].raw = ta.value;
  state[panel].mode = 'view';
  parseAndFormat(panel);
  renderPanel(panel);
}

function cancelEdit(panel) {
  state[panel].mode = 'view';
  renderPanel(panel);
}

function clearPanel(panel) {
  if (state[panel].raw && !confirm('确定清空【' + PANEL_NAMES[panel] + '】的内容吗？')) return;
  state[panel] = { raw: '', parsed: null, formatted: '', pathRanges: {}, totalLines: 0, error: null, mode: 'view' };
  renderPanel(panel);
}

function setFilter(filter, event) {
  if (event) event.stopPropagation();
  state.currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === filter));
  const pair = document.getElementById('comparePair').value;
  renderResults(pair[0].toUpperCase(), pair[1].toUpperCase());
}

function toggleResult() {
  state.resultCollapsed = !state.resultCollapsed;
  document.getElementById('resultPanel').classList.toggle('collapsed', state.resultCollapsed);
}

// ============================================================
// 初始化
// ============================================================
document.querySelectorAll('.icon-btn[data-icon]').forEach(btn => {
  btn.innerHTML = ICONS[btn.dataset.icon] || '';
});
document.getElementById('toggleIcon').innerHTML = ICONS.chevron;

document.getElementById('runDiff').addEventListener('click', runDiff);
document.getElementById('comparePair').addEventListener('change', function () {
  if (state.diffResults.length) {
    const pair = this.value;
    renderResults(pair[0].toUpperCase(), pair[1].toUpperCase());
    highlightDiffs(pair[0].toUpperCase(), pair[1].toUpperCase());
  }
});

// 同步滚动（可选）
let syncScrolling = false;
document.addEventListener('scroll', function (e) {
  if (!e.target.classList || !e.target.classList.contains('code-area')) return;
  if (syncScrolling) return;
  syncScrolling = true;
  const target = e.target;
  const panels = ['A', 'B', 'C'];
  for (const p of panels) {
    const ca = document.getElementById('code' + p);
    const ln = document.getElementById('ln' + p);
    if (ca && ca !== target) ca.scrollTop = target.scrollTop;
    if (ln) ln.scrollTop = target.scrollTop;
  }
  setTimeout(() => { syncScrolling = false; }, 50);
}, true);
</script>
</body>
</html>
