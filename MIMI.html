<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>猫咪喂食时刻换算</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --paper:#f6f1e7; --card:#fffdf7; --ink:#3d3428; --sub:#8a7f6b;
    --line:#dcd2c0; --cinnabar:#a8322d; --accent:#b98a5e;
  }
  html,body{min-height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong",SimSun,serif;
    background:var(--paper); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    padding:40px 16px; overflow-x:hidden;
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      repeating-linear-gradient(90deg, rgba(61,52,40,.02) 0 1px, transparent 1px 5px),
      radial-gradient(circle at 88% 10%, rgba(185,138,94,.09), transparent 24%);
  }
  .fuji{
    position:fixed; right:20px; bottom:0; width:190px; height:118px;
    pointer-events:none; z-index:0;
  }
  .fuji::before{
    content:""; position:absolute; left:0; bottom:0;
    width:0; height:0;
    border-left:95px solid transparent; border-right:95px solid transparent;
    border-bottom:105px solid rgba(61,52,40,.06);
  }
  .fuji::after{
    content:""; position:absolute; left:50%; top:4px; transform:translateX(-50%);
    width:9px; height:9px; border-radius:50%; background:rgba(168,50,45,.18);
  }
  .page{
    position:relative; z-index:1;
    width:min(560px,100%);
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 10px 28px rgba(61,52,40,.08);
    padding:34px 38px 30px;
  }
  .kicker{
    display:flex; align-items:center; gap:10px;
    font-size:11px; letter-spacing:.5em; color:var(--sub);
  }
  .kicker::before,.kicker::after{content:"";height:1px;background:var(--cinnabar);flex:1;opacity:.45}
  h1{font-size:23px; font-weight:600; text-align:center; letter-spacing:.14em; margin:16px 0 6px}
  .sub{text-align:center; font-size:12px; color:var(--sub); letter-spacing:.2em}
  .seal{
    position:absolute; top:26px; right:28px;
    width:42px; height:42px; background:var(--cinnabar); color:var(--paper);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; transform:rotate(-7deg);
    box-shadow:0 2px 6px rgba(168,50,45,.28);
  }
  .step{display:flex; align-items:center; gap:10px; margin:26px 0 14px}
  .step .no{
    width:24px; height:24px; flex:none;
    border:1px solid var(--cinnabar); color:var(--cinnabar);
    display:flex; align-items:center; justify-content:center;
    font-size:12px; border-radius:50%;
  }
  .step h2{font-size:14px; font-weight:600; letter-spacing:.18em; white-space:nowrap}
  .step::after{content:""; flex:1; height:1px; background:var(--line)}
  .calib{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .field{display:flex; flex-direction:column; gap:6px}
  .field label{font-size:12px; color:var(--sub); letter-spacing:.12em}
  input[type="time"]{
    font-family:inherit; font-size:17px; color:var(--ink); letter-spacing:.06em;
    background:#fffdf7; border:1px solid var(--line); border-radius:2px;
    padding:9px 8px; width:100%;
  }
  input[type="time"]:focus{outline:none; border-color:var(--accent)}
  input[type="time"]::-webkit-calendar-picker-indicator{opacity:.25}
  .offset{
    grid-column:1 / -1;
    margin-top:12px; padding:11px 14px; line-height:1.8; font-size:13px;
    background:rgba(185,138,94,.09); border-left:3px solid var(--cinnabar);
    color:#5a4f3d;
  }
  .meal{
    display:grid; grid-template-columns:54px 1fr 26px 1fr;
    align-items:center; gap:10px; padding:11px 0;
    border-top:1px dashed var(--line);
  }
  .meal:first-of-type{border-top:none}
  .meal .mz{
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:14px; letter-spacing:.3em; color:var(--cinnabar);
    justify-self:center;
  }
  .meal .arrow{color:var(--sub); text-align:center; font-size:13px}
  .meal .out{
    font-size:17px; font-variant-numeric:tabular-nums;
    text-align:center; letter-spacing:.04em;
  }
  .meal .out small{font-size:10px; color:var(--sub); margin-left:4px; letter-spacing:0}
  .diet-inputs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  select{
    font-family:inherit; font-size:15px; color:var(--ink);
    background:#fffdf7; border:1px solid var(--line); border-radius:2px;
    padding:9px 6px; width:100%;
  }
  select:focus{outline:none; border-color:var(--accent)}
  .diet-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line); margin-top:12px;
  }
  .cell{background:var(--card); padding:12px 14px; display:flex; flex-direction:column; gap:4px}
  .cell .k{font-size:11px; color:var(--sub); letter-spacing:.12em}
  .cell .val{font-size:20px; font-variant-numeric:tabular-nums; line-height:1.2}
  .cell .u{font-size:11px; color:var(--sub)}
  .note{
    margin-top:24px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--sub); line-height:2;
  }
  .note b{color:var(--cinnabar); font-weight:600}
  @media (max-width:520px){
    .page{padding:28px 20px 24px}
    .seal{right:18px; top:22px}
    .calib{grid-template-columns:1fr}
    .diet-inputs{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="fuji"></div>
<div class="page">
  <div class="seal">餌</div>
  <div class="kicker">猫の給餌時刻</div>
  <h1>猫咪喂食时刻换算</h1>
  <div class="sub">— 喂食器时间校准 · 四餐设定 —</div>

  <div class="step"><span class="no">壹</span><h2>校准机器偏差</h2></div>
  <div class="calib">
    <div class="field">
      <label for="bjNow">当前北京时间</label>
      <input type="time" id="bjNow">
    </div>
    <div class="field">
      <label for="macNow">当前机器时间</label>
      <input type="time" id="macNow">
    </div>
    <div class="offset" id="offsetInfo">—— 请先输入当前北京时间与机器时间，以校准偏差 ——</div>
  </div>

  <div class="step"><span class="no">贰</span><h2>四餐设定（北京时间）</h2></div>
  <div class="meal">
    <span class="mz">早餐</span>
    <input type="time" id="breakfast" value="08:00">
    <span class="arrow">→</span>
    <span class="out" id="o-breakfast">—</span>
  </div>
  <div class="meal">
    <span class="mz">午餐</span>
    <input type="time" id="lunch" value="12:30">
    <span class="arrow">→</span>
    <span class="out" id="o-lunch">—</span>
  </div>
  <div class="meal">
    <span class="mz">晚餐</span>
    <input type="time" id="dinner" value="19:00">
    <span class="arrow">→</span>
    <span class="out" id="o-dinner">—</span>
  </div>
  <div class="meal">
    <span class="mz">夜宵</span>
    <input type="time" id="supper" value="23:00">
    <span class="arrow">→</span>
    <span class="out" id="o-supper">—</span>
  </div>

  <div class="step"><span class="no">叁</span><h2>配餐建议</h2></div>
  <div class="diet-inputs">
    <div class="field">
      <label for="catWeight">猫咪体重（kg）</label>
      <input type="number" id="catWeight" min="0.5" max="15" step="0.1" placeholder="如 4.2">
    </div>
    <div class="field">
      <label for="catStage">猫咪阶段</label>
      <select id="catStage">
        <option value="adult">成年（1–7 岁）</option>
        <option value="neutered">绝育 / 易胖</option>
        <option value="senior">老年（7 岁以上）</option>
        <option value="kitten">幼猫（1 岁以下）</option>
      </select>
    </div>
  </div>
  <div class="diet-grid">
    <div class="cell"><span class="k">每日热量</span><span class="val" id="r-kcal">—</span><span class="u">kcal</span></div>
    <div class="cell"><span class="k">每日干粮</span><span class="val" id="r-dry">—</span><span class="u">g</span></div>
    <div class="cell"><span class="k">每顿干粮 · 4 餐</span><span class="val" id="r-dryper">—</span><span class="u">g</span></div>
    <div class="cell"><span class="k">每日主食湿粮</span><span class="val" id="r-wet">—</span><span class="u">g</span></div>
  </div>
  <div class="offset" id="dietNote">—— 请输入猫咪体重，以估算每日配餐量 ——</div>

  <div class="note">
    <b>换算规则</b>：机器设定时间 = 期望北京时间 +（机器时间 − 北京时间）。<br>
    机器偏慢则自动提前设定，偏快则自动延后；结果标注「翌日」表示该时刻属次日凌晨。
  </div>
</div>

<script>
  var v=function(id){return document.getElementById(id).value;};
  var toMin=function(s){
    if(!s) return null;
    var p=s.split(':').map(Number);
    return p[0]*60+p[1];
  };
  var fmt=function(m){
    m=((m%1440)+1440)%1440;
    return (String(Math.floor(m/60)).padStart(2,'0'))+':'+(String(m%60).padStart(2,'0'));
  };
  var meals=[['breakfast','早餐'],['lunch','午餐'],['dinner','晚餐'],['supper','夜宵']];
  function update(){
    var bj=toMin(v('bjNow')), mac=toMin(v('macNow'));
    var info=document.getElementById('offsetInfo');
    if(bj==null||mac==null){
      info.textContent='—— 请先输入当前北京时间与机器时间，以校准偏差 ——';
      meals.forEach(function(m){document.getElementById('o-'+m[0]).textContent='—';});
      return;
    }
    var off=mac-bj;
    if(off===0){
      info.textContent='机器时间与北京时间一致，无需补偿，直接按期望时间填入即可。';
    }else{
      var ahead=off>0, d=Math.abs(off), h=Math.floor(d/60), m=d%60;
      var s=(h?h+' 小时':'')+(h&&m?' ':'')+(m?m+' 分钟':'');
      info.textContent='机器时间比北京时间'+(ahead?'快':'慢')+' '+s+'，机器设定时间应'+(ahead?'延后':'提前')+' '+s+'。';
    }
    meals.forEach(function(meal){
      var id=meal[0], t=toMin(v(id));
      var el=document.getElementById('o-'+id);
      if(t==null){el.textContent='—';return;}
      var raw=t+off, next=raw<0||raw>=1440;
      el.innerHTML=fmt(raw)+(next?' <small>翌日</small>':'');
    });
  }
  ['bjNow','macNow','breakfast','lunch','dinner','supper'].forEach(function(id){
    document.getElementById(id).addEventListener('input',update);
  });
  var stageMult={adult:1.0, neutered:0.85, senior:0.8, kitten:2.5};
  var stageName={adult:'成年', neutered:'绝育/易胖', senior:'老年', kitten:'幼猫'};
  function diet(){
    var w=parseFloat(v('catWeight')), stage=v('catStage');
    var kk=document.getElementById('r-kcal'), dd=document.getElementById('r-dry'),
        dp=document.getElementById('r-dryper'), wt=document.getElementById('r-wet'),
        note=document.getElementById('dietNote');
    if(!(w>0)){
      kk.textContent=dd.textContent=dp.textContent=wt.textContent='—';
      note.textContent='—— 请输入猫咪体重，以估算每日配餐量 ——';
      return;
    }
    if(w<0.5||w>15){
      kk.textContent=dd.textContent=dp.textContent=wt.textContent='—';
      note.textContent='体重超出常见范围（0.5–15 kg），请核对输入。';
      return;
    }
    var kcal=Math.round(70*Math.pow(w,0.75)*(stageMult[stage]||1));
    var dry=Math.round(kcal/3.8), wet=Math.round(kcal/0.9);
    kk.textContent=kcal; dd.textContent=dry;
    dp.textContent=Math.round(dry/4); wt.textContent=wet;
    note.textContent='按 '+(w%1?w.toFixed(1):w)+' kg · '+stageName[stage]+'估算：每日约 '+kcal+' kcal。干粮按 380 kcal/100g、主食湿粮按 90 kcal/100g 折算，每顿按每日 4 餐均分；实际请以猫粮包装建议为准，孕猫、哺乳期或病猫请遵医嘱。';
  }
  ['catWeight','catStage'].forEach(function(id){
    document.getElementById(id).addEventListener('input',diet);
  });
</script>
</body>
</html>
